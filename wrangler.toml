name = "live-score-football"
main = "worker/index.js"
compatibility_date = "2026-04-26"

[placement]
mode = "smart"

[[analytics_engine_datasets]]
binding = "USAGE_ANALYTICS"
dataset = "hype_usage"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1
