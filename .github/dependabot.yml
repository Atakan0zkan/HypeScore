version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: cron
      cronjob: "30 6 * * *"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
    groups:
      dev-toolchain:
        patterns: ["*"]
        update-types: [minor, patch]
      security-fixes:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: chore(deps)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "45 6 * * *"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
    groups:
      actions-compatible:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: chore(actions)
