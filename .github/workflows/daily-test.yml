# Daily deterministic validation. No AI provider or extra API key is required.
# Failure reporting sends job states and a run link, never raw logs.
# - live-smoke: blocking production check with deterministic incident handling.
name: Daily tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * *" # 07:00 TRT (UTC+3) every day
  workflow_dispatch: # manual "Run workflow" button

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
      # Required: tests/ imports devDeps (happy-dom). Previously zero-dep,
      # so this step was unnecessary — it is mandatory now.
      - run: npm ci
      - run: npm test
      - run: npm run security:check
      - name: Measure source coverage
        run: npm run test:coverage > coverage-summary.txt
      - name: Validate Worker deployment bundle
        run: npx --no-install wrangler deploy --dry-run --outdir dist/worker-dry-run
      - run: npm audit --audit-level=moderate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ always() }}
        with:
          name: offline-validation
          path: coverage-summary.txt
          retention-days: 7

  failure-report:
    needs: [offline-tests, e2e]
    if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.repository == 'Atakan0zkan/HypeScore' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    concurrency:
      group: daily-test-incident
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
      - name: Maintain one deterministic validation incident
        run: node tools/report-test-failure.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HYPE_TEST_RESULTS: '{"offline":"${{ needs.offline-tests.result }}","e2e":"${{ needs.e2e.result }}"}'

  live-smoke:
    if: ${{ github.event_name != 'pull_request' && github.repository == 'Atakan0zkan/HypeScore' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      checks: read
      issues: write
    concurrency:
      group: production-availability
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
      - name: Wait for this commit's Cloudflare deployment
        if: ${{ github.event_name == 'push' }}
        run: node tools/wait-for-worker-build.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Confirm production health and maintain one incident
        run: node tools/production-monitor.mjs --manage-incidents
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HYPE_MONITOR_ASSIGNEE: Atakan0zkan

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: xvfb-run -a npx playwright test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ always() }}
        with:
          name: browser-validation
          path: |
            playwright-report/
            test-results/
          retention-days: 7
