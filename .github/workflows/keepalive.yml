# Keeps the daily schedule alive during quiet months.
# GitHub disables cron schedules after 60 days without repository activity.
# This workflow runs monthly and pushes an EMPTY commit only when the last
# commit is older than 45 days, so history stays clean (max ~8 tiny commits
# per year, zero in active months).
name: Keepalive

on:
  schedule:
    - cron: "5 6 1 * *" # 06:05 UTC on the 1st of each month
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Empty commit if quiet for 45+ days
        shell: bash
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          age_days=$(( (now - last) / 86400 ))
          echo "Last commit was $age_days days ago"
          if [ "$age_days" -gt 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keep scheduled workflows alive"
            git push
          else
            echo "Repo is active, nothing to do"
          fi
