# Daily offline test run. No AI tokens spent unless tests fail.
# - offline-tests: dumb `npm test` on a timer ($0 on public repo).
# - ai-triage: wakes ONLY when offline-tests fails, reads the failed log
#   with a free Zen model and opens a triage issue. Needs repo secret
#   OPENCODE_API_KEY (Zen key) — see README note below.
# - live-smoke: blocking production check with deterministic incident handling.
name: Daily tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * *" # 07:00 TRT (UTC+3) every day
  workflow_dispatch: # manual "Run workflow" button

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      # Required: tests/ imports devDeps (happy-dom). Previously zero-dep,
      # so this step was unnecessary — it is mandatory now.
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=moderate

  ai-triage:
    needs: offline-tests
    if: ${{ failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Primary: free (limited time). If Zen retires it, swap to backup:
          # opencode/muse-spark-1.2-contributor-free (free, 1M ctx, same family)
          model: opencode/muse-spark-1.3-contributor-free
          use_github_token: true
          prompt: |
            The daily `npm test` run failed (run id ${{ github.run_id }}).
            1. Fetch ONLY the failed log lines: `gh run view ${{ github.run_id }} --log-failed | head -100`
            2. Identify the failing test file and the exact assertion (tests/ or tools/).
            3. Open ONE GitHub issue titled `[daily-test] <failing test name>` with:
               - failing test file + error excerpt (max 20 lines)
               - suspected source file + line (worker/index.js or extension/popup.js)
               - one minimal suggested fix, no code changes, no PR
               Write the issue body in English. Do not push commits.

  live-smoke:
    if: ${{ github.event_name != 'pull_request' && github.repository == 'Atakan0zkan/HypeScore' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      checks: read
      issues: write
    concurrency:
      group: production-availability
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Wait for this commit's Cloudflare deployment
        if: ${{ github.event_name == 'push' }}
        run: node tools/wait-for-worker-build.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Confirm production health and maintain one incident
        run: node tools/production-monitor.mjs --manage-incidents
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HYPE_MONITOR_ASSIGNEE: Atakan0zkan

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: xvfb-run -a npx playwright test
